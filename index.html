<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metro Live</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #09090b; color: #f4f4f5; padding-bottom: 40px; }
    header { position: sticky; top: 0; z-index: 20; background: rgba(9,9,11,0.92); backdrop-filter: blur(8px); border-bottom: 1px solid #27272a; padding: 12px 16px; }
    .wrap { max-width: 480px; margin: 0 auto; }
    .hdr-row { display: flex; align-items: center; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16px; }
    .logo { width: 28px; height: 28px; border-radius: 7px; background: #2dd4bf; color: #000; display: flex; align-items: center; justify-content: center; font-weight: 900; }
    .live-pill { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #a1a1aa; background: #18181b; padding: 4px 10px; border-radius: 99px; border: 1px solid #27272a; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #34d399; }
    main { padding: 14px 16px; }
    .panel { background: #18181b; border: 1px solid #27272a; border-radius: 16px; padding: 12px; margin-bottom: 16px; display: flex; flex-direction: column; gap: 10px; }
    select { width: 100%; background: #09090b; color: #fff; border: 1px solid #3f3f46; border-radius: 12px; padding: 11px 12px; font-size: 15px; font-weight: 700; }
    .tabs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; background: #09090b; padding: 4px; border-radius: 12px; border: 1px solid #27272a; }
    .tab { border: none; background: transparent; color: #a1a1aa; padding: 9px 4px; border-radius: 9px; font-size: 13px; font-weight: 800; cursor: pointer; }
    .tab.active { background: #2dd4bf; color: #000; }
    .card { background: #18181b; border: 1px solid #27272a; border-radius: 18px; padding: 16px 14px; margin-bottom: 14px; }
    .card.next { border-color: #2dd4bf; }
    .eta-row { display: flex; justify-content: flex-end; margin-bottom: 8px; min-height: 24px; }
    .eta { background: #2dd4bf; color: #000; font-weight: 900; font-size: 14px; padding: 4px 12px; border-radius: 99px; }
    .eta.now { background: #34d399; }
    .status-box { text-align: center; background: #09090b; border: 1px solid #27272a; border-radius: 14px; padding: 10px 12px; margin-bottom: 14px; }
    .status-top { font-size: 11px; font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 3px; }
    .status-top.moving { color: #2dd4bf; }
    .status-top.stopped { color: #fbbf24; }
    .status-station { font-size: 18px; font-weight: 900; color: #fff; }
    .track-lbl { display: flex; justify-content: space-between; font-size: 10px; font-weight: 900; letter-spacing: 0.08em; margin-bottom: 6px; padding: 0 2px; }
    .train-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
    .car { border: 2px solid #3f3f46; border-radius: 8px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; background: #27272a; }
    .car:first-child { border-top-left-radius: 16px; border-bottom-left-radius: 16px; }
    .car:last-child { border-top-right-radius: 22px; border-bottom-right-radius: 22px; }
    .car.c-green { background: rgba(16,185,129,0.2); border-color: #34d399; }
    .car.c-amber { background: rgba(245,158,11,0.2); border-color: #fbbf24; }
    .car.c-orange { background: rgba(249,115,22,0.22); border-color: #f97316; }
    .car.c-red { background: rgba(225,29,72,0.25); border-color: #f43f5e; }
    .car.best { box-shadow: 0 0 12px rgba(52,211,153,0.45); transform: scale(1.04); border-width: 2.5px; }
    .car-num { font-size: 13px; font-weight: 900; margin-bottom: 6px; color: #fff; }
    .dots { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; }
    .p-dot { width: 8px; height: 8px; border-radius: 50%; background: #3f3f46; }
    .c-green .p-dot.on { background: #34d399; }
    .c-amber .p-dot.on { background: #fbbf24; }
    .c-orange .p-dot.on { background: #f97316; }
    .c-red .p-dot.on { background: #f43f5e; }
    .plat-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 8px; padding-top: 6px; border-top: 1px dashed #3f3f46; }
    .plat-slot { text-align: center; }
    .bar { height: 5px; border-radius: 99px; background: #27272a; margin-bottom: 4px; }
    .bar.stand { background: #34d399; box-shadow: 0 0 8px #34d399; }
    .slot-txt { font-size: 9px; font-weight: 800; color: #71717a; }
    .slot-txt.stand { color: #34d399; }
    .shutdown-banner { background: #7f1d1d; border: 2px solid #ef4444; color: #fecaca; border-radius: 18px; padding: 28px 20px; text-align: center; }
    .shutdown-title { font-size: 20px; font-weight: 900; color: #fff; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 6px; }
    .shutdown-sub { font-size: 14px; color: #fecaca; }
    .info-box { text-align: center; padding: 28px 16px; background: #18181b; border-radius: 16px; border: 1px solid #27272a; color: #a1a1aa; font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <div class="wrap hdr-row">
      <div class="brand"><div class="logo">M</div><span>Sardines</span></div>
      <div class="live-pill" title="Last refreshed from TfNSW"><span class="dot"></span><span id="updated">Syncing...</span></div>
    </div>
  </header>
  <main class="wrap">
    <div id="controlsPanel" class="panel">
      <select id="lineSelect">
        <option value="M1">M1 Metro Line</option>
      </select>
      <div class="tabs">
        <button id="btn-Bankstown" class="tab active" onclick="setDir('Bankstown')">City / Bankstown</button>
        <button id="btn-Tallawong" class="tab" onclick="setDir('Tallawong')">Tallawong</button>
      </div>
      <select id="stationSelect" onchange="onStationChange()">
        <option value="ALL">All Stations (In Line Order)</option>
      </select>
      <div id="modeTabs" class="tabs" style="display:none;">
        <button id="mode-NEXT" class="tab active" onclick="setMode('NEXT')">Next Train Only</button>
        <button id="mode-ALL" class="tab" onclick="setMode('ALL')">All Approaching</button>
      </div>
    </div>
    <div id="trains"></div>
  </main>
  <script>
    const ORDER = [
      "Tallawong","Rouse Hill","Kellyville","Bella Vista","Norwest",
      "Hills Showground","Castle Hill","Cherrybrook","Epping",
      "Macquarie University","Macquarie Park","North Ryde","Chatswood",
      "Crows Nest","Victoria Cross","Barangaroo","Martin Place",
      "Gadigal","Central","Waterloo","Sydenham",
      "Marrickville","Dulwich Hill","Hurlstone Park","Canterbury",
      "Campsie","Belmore","Lakemba","Wiley Park","Punchbowl","Bankstown"
    ];
    let data = { stations: [], trains: [] };
    let loadedOnce = false;
    let dir = localStorage.getItem('metro_dir') === 'Tallawong' ? 'Tallawong' : 'Bankstown';
    let mode = localStorage.getItem('metro_mode') === 'ALL' ? 'ALL' : 'NEXT';
    let ready = false;

    function fillStations(list) {
      if (ready || !list || !list.length) return;
      const sel = document.getElementById('stationSelect');
      list.forEach(st => {
        const o = document.createElement('option');
        o.value = st; o.textContent = st;
        sel.appendChild(o);
      });
      const saved = localStorage.getItem('metro_station');
      if (saved && (saved === 'ALL' || list.includes(saved))) sel.value = saved;
      ready = true;
    }

    function onStationChange() {
      localStorage.setItem('metro_station', document.getElementById('stationSelect').value);
      render();
    }

    function setDir(v) {
      dir = v;
      localStorage.setItem('metro_dir', v);
      ['Bankstown', 'Tallawong'].forEach(k => {
        document.getElementById('btn-' + k).classList.toggle('active', k === v);
      });
      render();
    }

    function setMode(m) {
      mode = m;
      localStorage.setItem('metro_mode', m);
      ['NEXT', 'ALL'].forEach(k => {
        document.getElementById('mode-' + k).classList.toggle('active', k === m);
      });
      render();
    }

    function carStyle(score) {
      if (score <= 2) return { cls: 'c-green', fill: 1 };
      if (score === 3) return { cls: 'c-amber', fill: 2 };
      if (score === 4) return { cls: 'c-orange', fill: 3 };
      if (score < 90) return { cls: 'c-red', fill: 4 };
      return { cls: '', fill: 0 };
    }

    function stationIdx(name) {
      return ORDER.indexOf(name);
    }

    function render() {
      const box = document.getElementById('trains');
      const panel = document.getElementById('controlsPanel');
      if (!loadedOnce || !data.ready) return;

      const allTrains = data.trains || [];
      if (allTrains.length === 0) {
        panel.style.display = 'none';
        box.innerHTML = '<div class="shutdown-banner"><div class="shutdown-title">Metro Network Closed</div><div class="shutdown-sub">No M1 Metro services are currently operating.</div></div>';
        return;
      }

      panel.style.display = 'flex';
      const st = document.getElementById('stationSelect').value;
      document.getElementById('modeTabs').style.display = st === 'ALL' ? 'none' : 'grid';

      let list = allTrains.filter(t => t.dir === dir);

      if (st === 'ALL') {
        list.sort((a, b) => {
          const ia = stationIdx(a.station), ib = stationIdx(b.station);
          if (ia === -1 || ib === -1) return 0;
          return dir === 'Bankstown' ? ia - ib : ib - ia;
        });
      } else {
        const myIdx = stationIdx(st);
        list = list.filter(t => {
          const tIdx = stationIdx(t.station);
          if (tIdx === -1) return t.etas && (st in t.etas);
          return dir === 'Bankstown' ? tIdx <= myIdx : tIdx >= myIdx;
        });
        list.sort((a, b) => {
          const distA = stationIdx(a.station) !== -1 ? Math.abs(myIdx - stationIdx(a.station)) : 99;
          const distB = stationIdx(b.station) !== -1 ? Math.abs(myIdx - stationIdx(b.station)) : 99;
          if (distA !== distB) return distA - distB;
          const etaA = (a.etas && st in a.etas) ? a.etas[st] : 999;
          const etaB = (b.etas && st in b.etas) ? b.etas[st] : 999;
          return etaA - etaB;
        });
        if (mode === 'NEXT' && list.length > 0) {
          list = list.slice(0, 1);
        }
      }

      if (!list.length) {
        box.innerHTML = `<div class="info-box">No upcoming trains approaching <strong>${st}</strong> toward <strong>${dir}</strong> right now.</div>`;
        return;
      }

      box.innerHTML = list.map((t, idx) => {
        let mins = null;
        if (st !== 'ALL') {
          if (t.etas && st in t.etas) {
            mins = t.etas[st];
          } else if (t.station === st) {
            mins = (t.state || '').includes('STOPPED') ? 0 : 1;
          } else {
            const d = Math.abs(stationIdx(st) - stationIdx(t.station));
            if (d < 90) mins = d * 3;
          }
        }
        const scores = t.carriages.map(c => c.score);
        const minS = Math.min(...scores);
        const best = new Set(t.carriages.filter(c => c.score === minS && minS <= 3).map(c => c.pos));
        const reversed = [...t.carriages].reverse();
        const isStopped = (t.state || '').includes('STOPPED');
        const stateText = isStopped ? 'STOPPED AT' : 'MOVING TO';

        const etaHtml = mins !== null
          ? `<div class="eta-row"><span class="eta ${mins <= 1 ? 'now' : ''}">${mins === 0 ? 'NOW' : mins + ' min'}</span></div>`
          : '';

        return `
        <div class="card ${idx === 0 && st !== 'ALL' ? 'next' : ''}">
          ${etaHtml}
          <div class="status-box">
            <div class="status-top ${isStopped ? 'stopped' : 'moving'}">${stateText}</div>
            <div class="status-station">${t.station}</div>
          </div>
          <div class="track-lbl"><span style="color:#71717a">REAR</span><span style="color:#2dd4bf">FRONT &#9654;&#9654;</span></div>
          <div class="train-grid">
            ${reversed.map(c => {
              const s = carStyle(c.score);
              const isB = best.has(c.pos);
              let dots = '';
              for (let i = 1; i <= 4; i++) dots += `<span class="p-dot ${i <= s.fill ? 'on' : ''}"></span>`;
              return `<div class="car ${s.cls} ${isB ? 'best' : ''}"><div class="car-num">${c.pos}</div><div class="dots">${dots}</div></div>`;
            }).join('')}
          </div>
          <div class="plat-row">
            ${reversed.map(c => {
              const isB = best.has(c.pos);
              const doorNum = (c.pos - 1) * 4 + 1;
              return `<div class="plat-slot"><div class="bar ${isB ? 'stand' : ''}"></div><div class="slot-txt ${isB ? 'stand' : ''}">${isB ? 'STAND' : 'D' + doorNum}</div></div>`;
            }).join('')}
          </div>
        </div>`;
      }).join('');
    }

    async function refresh() {
      try {
        const res = await fetch('/api/metro');
        data = await res.json();
        loadedOnce = true;
        fillStations(data.stations);
        document.getElementById('updated').textContent = data.updated_at;
        render();
      } catch (e) {
        document.getElementById('updated').textContent = 'Offline';
      }
    }

    setDir(dir);
    setMode(mode);
    refresh();
    setInterval(refresh, 5000);
  </script>
</body>
</html>
